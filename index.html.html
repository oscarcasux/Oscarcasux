<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscar Castillo — Senior Multimedia Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f9f9f7;
  --surface: #ffffff;
  --text: #1c1c1e;
  --text-2: #6e6e73;
  --text-3: #aeaeb2;
  --accent: #ff6430;
  --accent-light: #fff3ef;
  --border: #e5e5ea;
  --shadow-sm: 0 1px 8px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.14);
  --radius: 20px;
  --nav-h: 64px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px;
  background: rgba(249,249,247,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: box-shadow 0.3s;
}
nav.scrolled { box-shadow: var(--shadow-sm); }

.nav-logo {
  font-size: 17px; font-weight: 700; color: var(--text);
  text-decoration: none; letter-spacing: -0.3px;
}
.nav-logo span { color: var(--accent); }

.nav-right { display: flex; align-items: center; gap: 32px; }

.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a {
  font-size: 14px; font-weight: 500; color: var(--text-2);
  text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover { color: var(--text); }

/* Language toggle */
.lang-toggle {
  display: flex; align-items: center;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 100px; padding: 3px; gap: 2px;
  cursor: pointer;
}
.lang-btn {
  font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
  padding: 5px 12px; border-radius: 100px; border: none;
  background: transparent; color: var(--text-2);
  cursor: pointer; transition: all 0.22s;
}
.lang-btn.active {
  background: var(--text); color: #fff;
}

/* ── HERO ── */
#hero {
  min-height: 100vh;
  display: flex; align-items: center;
  padding: calc(var(--nav-h) + 48px) 48px 80px;
  max-width: 1200px; margin: 0 auto;
  gap: 80px;
}

.hero-text { flex: 1; }

.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--accent);
  background: var(--accent-light); padding: 6px 14px;
  border-radius: 100px; margin-bottom: 28px;
}
.hero-eyebrow::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.4); }
}

.hero-name {
  font-size: clamp(52px, 6vw, 88px);
  font-weight: 800; line-height: 1.0;
  letter-spacing: -3px; color: var(--text);
  margin-bottom: 20px;
}
.hero-name em { font-style: normal; color: var(--accent); }

.hero-title {
  font-size: clamp(17px, 1.8vw, 22px); font-weight: 500;
  color: var(--text-2); line-height: 1.6; margin-bottom: 40px;
  max-width: 480px;
}

.hero-cta { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 28px; border-radius: 100px;
  background: var(--text); color: #fff;
  font-size: 15px; font-weight: 600;
  text-decoration: none; transition: all 0.25s;
}
.btn-primary:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,100,48,0.35); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 28px; border-radius: 100px;
  background: transparent; color: var(--text);
  font-size: 15px; font-weight: 600;
  text-decoration: none; border: 1.5px solid var(--border);
  transition: all 0.25s;
}
.btn-secondary:hover { border-color: var(--text); transform: translateY(-2px); }

.hero-photo-wrap { flex-shrink: 0; position: relative; }
.hero-photo {
  width: 300px; height: 300px; border-radius: 50%;
  object-fit: cover; object-position: center top;
  box-shadow: var(--shadow-lg);
  border: 4px solid var(--surface);
  object-position: center 10%;
}

.hero-badge {
  position: absolute; bottom: 20px; right: -16px;
  background: var(--surface); border-radius: 16px;
  padding: 12px 18px; box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.hero-badge-label { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }
.hero-badge-value { font-size: 20px; font-weight: 800; color: var(--text); margin-top: 2px; }

.hero-stats {
  display: flex; gap: 40px; margin-top: 48px;
  padding-top: 40px; border-top: 1px solid var(--border);
}
.stat-num { font-size: 32px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
.stat-num span { color: var(--accent); }
.stat-label { font-size: 13px; color: var(--text-2); margin-top: 2px; }

/* ── SECTIONS ── */
section { padding: 100px 48px; max-width: 1200px; margin: 0 auto; }

.section-tag {
  font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 12px;
}
.section-title {
  font-size: clamp(32px, 4vw, 52px); font-weight: 800;
  letter-spacing: -2px; color: var(--text); line-height: 1.05;
  margin-bottom: 56px;
}
.section-title em { font-style: normal; color: var(--accent); }

/* ── PROJECTS GRID ── */
.projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }

.project-card {
  background: var(--surface); border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
  opacity: 0; transform: translateY(24px);
}
.project-card.visible { opacity: 1; transform: translateY(0); }
.project-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: var(--shadow-lg); }

.project-thumb {
  width: 100%; aspect-ratio: 16/10; overflow: hidden; position: relative;
  background: #f0f0f0;
}
.project-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top left; transition: transform 0.5s ease; }
.project-card:hover .project-thumb img { transform: scale(1.04); }

.project-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.3s;
}
.project-card:hover .project-overlay { opacity: 1; }

.view-pill {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
  padding: 8px 20px; border-radius: 100px;
  font-size: 13px; font-weight: 600; color: var(--text);
  opacity: 0; transition: all 0.3s; white-space: nowrap;
}
.project-card:hover .view-pill { opacity: 1; transform: translateX(-50%) translateY(0); }

.project-info { padding: 20px 24px 24px; }

.project-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.project-category {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 4px 10px;
  border-radius: 100px; background: var(--accent-light); color: var(--accent);
}
.project-client { font-size: 12px; font-weight: 500; color: var(--text-2); }

.project-title {
  font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.35; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.project-desc-brief {
  font-size: 13px; color: var(--text-2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ── FEATURED CARD ── */
.project-card.featured {
  grid-column: span 2;
  display: grid; grid-template-columns: 1fr 420px;
  background: #0a1628;
}
.project-card.featured:hover { transform: translateY(-4px) scale(1.005); }

.featured-gallery {
  position: relative; overflow: hidden;
  aspect-ratio: unset; height: 100%; min-height: 340px;
}
.featured-gallery .slide {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity 0.7s ease;
}
.featured-gallery .slide.active { opacity: 1; }
.featured-gallery img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
}
.gallery-dots {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
}
.gallery-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.4); transition: all 0.3s; cursor: pointer;
}
.gallery-dot.active { background: #fff; width: 20px; border-radius: 3px; }

.featured-info {
  padding: 36px 32px; display: flex; flex-direction: column; justify-content: space-between;
}
.featured-info .project-category { background: rgba(255,100,48,0.18); color: #ff8860; border: 1px solid rgba(255,100,48,0.3); }
.featured-info .project-client { color: rgba(255,255,255,0.5); }
.featured-info .project-title { font-size: 22px; color: #fff; -webkit-line-clamp: 3; }
.featured-info .project-desc-brief { font-size: 14px; color: rgba(255,255,255,0.55); -webkit-line-clamp: 3; }

.featured-thumbnails {
  display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap;
}
.featured-thumb {
  width: 60px; height: 44px; border-radius: 8px; overflow: hidden;
  border: 2px solid transparent; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.featured-thumb.active { border-color: var(--accent); }
.featured-thumb img { width: 100%; height: 100%; object-fit: cover; }

.featured-view-btn {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 24px;
  padding: 12px 24px; border-radius: 100px; width: fit-content;
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  transition: all 0.2s;
}
.project-card.featured:hover .featured-view-btn { background: #ff7d52; transform: translateX(4px); }

/* ── MODAL GALLERY ── */
.modal-gallery { display: flex; gap: 8px; padding: 0 36px 24px; overflow-x: auto; }
.modal-gallery::-webkit-scrollbar { height: 4px; }
.modal-gallery::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.modal-gallery-thumb {
  width: 100px; height: 68px; flex-shrink: 0; border-radius: 10px;
  overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
}
.modal-gallery-thumb.active { border-color: var(--accent); }
.modal-gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

@media (max-width: 900px) {
  .project-card.featured { grid-column: span 1; grid-template-columns: 1fr; }
  .featured-gallery { min-height: 220px; }
  .featured-info { padding: 20px; }
}

/* ── MODAL ── */
/* ── MODAL ── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(16px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface); border-radius: 28px;
  max-width: 1020px; width: 100%; max-height: 92vh;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.25);
  transform: scale(0.94) translateY(20px);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-backdrop.open .modal { transform: scale(1) translateY(0); }

.modal-inner {
  display: grid; grid-template-columns: 1fr 360px;
  flex: 1; overflow: hidden; min-height: 0;
}

/* Left: image + thumbnails */
.modal-left {
  background: #111; display: flex; flex-direction: column;
  border-radius: 28px 0 0 28px; overflow: hidden;
}
.modal-img {
  flex: 1; width: 100%; min-height: 0;
  object-fit: cover; object-position: top center; display: block;
  transition: opacity 0.3s ease;
}
.modal-img.contain { object-fit: contain; background: #f9f6f2; }

.modal-thumbs {
  display: flex; gap: 8px; padding: 10px 12px;
  background: rgba(0,0,0,0.6); overflow-x: auto; flex-shrink: 0;
}
.modal-thumbs::-webkit-scrollbar { height: 3px; }
.modal-thumbs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 2px; }
.modal-thumb {
  width: 68px; height: 48px; flex-shrink: 0; border-radius: 7px;
  overflow: hidden; cursor: pointer;
  border: 2px solid transparent; transition: all 0.2s;
  opacity: 0.5;
}
.modal-thumb.active { border-color: var(--accent); opacity: 1; }
.modal-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* Right: info panel */
.modal-right {
  display: flex; flex-direction: column; overflow-y: auto;
  padding: 28px 24px 24px;
  border-left: 1px solid var(--border);
}
.modal-top-row {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
}
.modal-category {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-light); padding: 5px 12px;
  border-radius: 100px; display: inline-block;
}
.modal-close {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 15px; color: var(--text-2);
  flex-shrink: 0; transition: all 0.2s;
}
.modal-close:hover { background: var(--text); color: #fff; }
.modal-title {
  font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
  color: var(--text); line-height: 1.25; margin-bottom: 14px;
}
.modal-client-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 18px; padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.modal-client-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.modal-client-name {
  font-size: 13px; font-weight: 700; color: var(--text);
  padding: 4px 10px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--border);
}
.modal-desc {
  font-size: 14px; color: var(--text-2); line-height: 1.8;
  flex: 1; text-wrap: pretty;
}

@media (max-width: 800px) {
  .modal-inner { grid-template-columns: 1fr; }
  .modal-left { border-radius: 28px 28px 0 0; max-height: 260px; }
  .modal-right { padding: 18px; }
}

/* ── AI TOOLS ── */
.ai-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
}
.ai-card {
  background: var(--surface); border-radius: 18px;
  border: 1px solid var(--border);
  padding: 24px 20px; text-align: center;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
  box-shadow: var(--shadow-sm);
}
.ai-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.ai-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px; font-size: 26px;
}
.ai-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 6px; letter-spacing: -0.2px; }
.ai-use { font-size: 12px; color: var(--text-2); line-height: 1.5; }
.ai-badge {
  display: inline-block; margin-top: 10px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 100px;
  background: var(--accent-light); color: var(--accent);
}
@media (max-width: 900px) { .ai-grid { grid-template-columns: repeat(2, 1fr); } }

/* ── AI TOOLS ── */
#skills { background: var(--surface); border-radius: 32px; max-width: none; margin: 0 48px; padding: 80px; }
.skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.skill-group-title {
  font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.2px;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 2px solid var(--accent); display: inline-block;
}
.skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.skill-tag {
  font-size: 13px; font-weight: 500; color: var(--text-2);
  padding: 6px 14px; border-radius: 100px;
  background: var(--bg); border: 1px solid var(--border);
  transition: all 0.2s;
}
.skill-tag:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

/* ── ABOUT ── */
.about-grid { display: grid; grid-template-columns: 260px 1fr; gap: 80px; align-items: start; }
.about-photo-col { position: sticky; top: 100px; }
.about-photo { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: center 15%; border-radius: var(--radius); box-shadow: var(--shadow); }
.about-social { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.social-link {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--text-2);
  font-size: 13px; font-weight: 500;
  padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
  transition: all 0.2s;
}
.social-link:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
.about-content h3 {
  font-size: 19px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; margin-top: 32px; letter-spacing: -0.3px;
}
.about-content h3:first-child { margin-top: 0; }
.about-content p { font-size: 16px; color: var(--text-2); line-height: 1.75; margin-bottom: 16px; }
.about-services { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.service-pill { font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 100px; background: var(--accent-light); color: var(--accent); }

/* ── CONTACT ── */
#contact { text-align: center; padding: 100px 48px; max-width: 680px; margin: 0 auto; }
.contact-card {
  background: var(--text); border-radius: 28px; padding: 72px 48px;
  position: relative; overflow: hidden;
}
.contact-card::before {
  content: ''; position: absolute;
  width: 400px; height: 400px; border-radius: 50%;
  background: var(--accent); opacity: 0.12;
  top: -100px; right: -100px; pointer-events: none;
}
.contact-title { font-size: clamp(30px, 4vw, 48px); font-weight: 800; color: #fff; letter-spacing: -2px; margin-bottom: 16px; }
.contact-sub { font-size: 16px; color: rgba(255,255,255,0.55); margin-bottom: 40px; line-height: 1.6; }
.contact-links { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.contact-link {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 28px; border-radius: 100px;
  font-size: 15px; font-weight: 600;
  text-decoration: none; transition: all 0.25s;
}
.contact-link.email { background: var(--accent); color: #fff; }
.contact-link.email:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(255,100,48,0.45); }
.contact-link.linkedin { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
.contact-link.linkedin:hover { background: rgba(255,255,255,0.18); transform: translateY(-3px); }

footer { text-align: center; padding: 40px; font-size: 13px; color: var(--text-3); border-top: 1px solid var(--border); }

/* ── ANIMATIONS ── */
.fade-up { opacity: 0; transform: translateY(28px); transition: opacity 0.6s ease, transform 0.6s ease; }
.fade-up.visible { opacity: 1; transform: translateY(0); }

/* ── LANG TRANSITION ── */
[data-i18n] { transition: opacity 0.18s ease; }
body.lang-switching [data-i18n] { opacity: 0; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  nav { padding: 0 20px; }
  .nav-links { display: none; }
  #hero { flex-direction: column-reverse; padding: 120px 24px 60px; gap: 40px; }
  .hero-photo { width: 200px; height: 200px; }
  .hero-badge { right: 0; }
  .hero-stats { gap: 24px; }
  section { padding: 60px 24px; }
  .projects-grid { grid-template-columns: 1fr; }
  .skills-grid { grid-template-columns: 1fr 1fr; }
  .about-grid { grid-template-columns: 1fr; }
  .about-photo-col { position: static; }
  .about-photo { aspect-ratio: 16/9; }
  #skills { margin: 0 20px; padding: 48px 24px; }
  #contact { padding: 60px 24px; }
  .contact-card { padding: 48px 24px; }
  .modal-body { padding: 20px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav id="mainNav">
  <a class="nav-logo" href="#hero">Oscar<span>.</span></a>

      `;
      card.addEventListener('click', (e) => {
        const dot = e.target.closest('.gallery-dot');
        const thumb = e.target.closest('.featured-thumb');
        if (dot || thumb) {
          const idx = parseInt((dot||thumb).dataset.idx);
          const gid = parseInt((dot||thumb).dataset.gid);
          setSlide(gid, idx);
          return;
        }
        openModal(i);
      });
      // Auto-advance
      startAutoSlide(i, imgs.length);
    } else {
      card.className = 'project-card' + (isVisible ? ' visible' : '');
      card.style.transitionDelay = `${i * 70}ms`;
      card.innerHTML = `
        <div class="project-thumb">
          <img src="${p.image}" alt="${pd.title}" loading="lazy">
          <div class="project-overlay"></div>
          <div class="view-pill">${t('view_project')}</div>
        </div>
        <div class="project-info">
          <div class="project-meta">
            <span class="project-category">${pd.category}</span>
            <span class="project-client">${p.client}</span>
          </div>
          <div class="project-title">${pd.title}</div>
          <div class="project-desc-brief">${pd.desc}</div>
        </div>
      `;
      card.addEventListener('click', () => openModal(i));
    }
    grid.appendChild(card);
  });
  document.querySelectorAll('.project-card').forEach(el => cardObserver.observe(el));
}

const slideStates = {};
const slideTimers = {};

function setSlide(gid, idx) {
  const fg = document.getElementById(`fg-${gid}`);
  const ft = document.getElementById(`ft-${gid}`);
  if (!fg) return;
  fg.querySelectorAll('.slide').forEach((s,j) => s.classList.toggle('active', j===idx));
  fg.querySelectorAll('.gallery-dot').forEach((d,j) => d.classList.toggle('active', j===idx));
  if (ft) ft.querySelectorAll('.featured-thumb').forEach((t,j) => t.classList.toggle('active', j===idx));
  slideStates[gid] = idx;
}

function startAutoSlide(gid, total) {
  clearInterval(slideTimers[gid]);
  slideStates[gid] = 0;
  slideTimers[gid] = setInterval(() => {
    const next = ((slideStates[gid] || 0) + 1) % total;
    setSlide(gid, next);
  }, 3000);
}

function renderSkills() {
  const grid = document.getElementById('skillsGrid');
  grid.innerHTML = '';
  skills[lang].forEach(g => {
    const div = document.createElement('div');
    div.className = 'skill-group fade-up';
    div.innerHTML = `
      <div class="skill-group-title">${g.title}</div>
      <div class="skill-tags">${g.tags.map(t => `<span class="skill-tag">${t}</span>`).join('')}</div>
    `;
    grid.appendChild(div);
  });
  document.querySelectorAll('#skills .fade-up').forEach(el => observer.observe(el));
}

function renderAbout() {
  document.getElementById('aboutContent').innerHTML = aboutContent[lang];
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.innerHTML = t(key);
  });
  document.documentElement.lang = lang;
}

function setLang(newLang) {
  if (newLang === lang) return;
  lang = newLang;
  localStorage.setItem('pf_lang', lang);

  document.body.classList.add('lang-switching');
  setTimeout(() => {
    applyTranslations();
    renderProjects();
    renderSkills();
    renderAbout();
    document.body.classList.remove('lang-switching');
    document.getElementById('btnEN').classList.toggle('active', lang === 'en');
    document.getElementById('btnES').classList.toggle('active', lang === 'es');
  }, 180);
}

document.getElementById('btnEN').addEventListener('click', () => setLang('en'));
document.getElementById('btnES').addEventListener('click', () => setLang('es'));

// Set initial button state
document.getElementById('btnEN').classList.toggle('active', lang === 'en');
document.getElementById('btnES').classList.toggle('active', lang === 'es');

/* ─── MODAL ─── */
const backdrop = document.getElementById('modalBackdrop');

function openModal(i) {
  const p = projects[i];
  const pd = p[lang];
  const imgs = p.images || [p.fullImage || p.image];
  const modalImgEl = document.getElementById('modalImg');
  const thumbsEl = document.getElementById('modalThumbs');

  // Image + fit
  modalImgEl.src = imgs[0];
  modalImgEl.className = 'modal-img' + (p.modalFit === 'contain' ? ' contain' : '');
  modalImgEl.style.opacity = '1';

  // Thumbnails
  thumbsEl.innerHTML = '';
  if (imgs.length > 1) {
    imgs.forEach((src, j) => {
      const th = document.createElement('div');
      th.className = 'modal-thumb' + (j === 0 ? ' active' : '');
      th.innerHTML = `<img src="${src}" loading="lazy">`;
      th.addEventListener('click', () => {
        modalImgEl.style.opacity = '0';
        setTimeout(() => { modalImgEl.src = src; modalImgEl.style.opacity = '1'; }, 150);
        thumbsEl.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
        th.classList.add('active');
      });
      thumbsEl.appendChild(th);
    });
    thumbsEl.style.display = 'flex';
  } else {
    thumbsEl.style.display = 'none';
  }

  document.getElementById('modalTitle').textContent = pd.title;
  document.getElementById('modalCategory').textContent = pd.category;
  document.getElementById('modalClient').textContent = p.client;
  document.getElementById('modalDesc').textContent = pd.desc;
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ─── INTERSECTION OBSERVERS ─── */
window._cardsVisible = false;
const cardObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      window._cardsVisible = true;
      cardObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      observer.unobserve(e.target);
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

window.addEventListener('scroll', () => {
  document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 20);
});

/* ─── INIT ─── */
applyTranslations();
renderProjects();
renderSkills();
renderAbout();
</script>
</body>
</html>
