<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body>
<div id="status">Loading...</div>
<div id="canvases"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

async function renderPDF() {
  const response = await fetch('uploads/oscar c folio 2026.pdf');
  const arrayBuffer = await response.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  document.getElementById('status').textContent = `PDF loaded: ${pdf.numPages} pages`;
  
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.5});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.id = `page-${i}`;
    canvas.style.cssText = 'display:block;margin:10px;border:1px solid #ccc;';
    document.getElementById('canvases').appendChild(canvas);
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    document.getElementById('status').textContent = `Rendered page ${i}/${pdf.numPages}`;
  }
  document.getElementById('status').textContent = 'Done! All pages rendered.';
}
renderPDF();
</script>
</body>
</html>
